[project]
name = "pySAFER"
version = "0.1.0"
authors = [
  { name="Rui Gao", email="rui.ray.gao@gmail.com" },
]
description = "Simple Algorithm for Evapotranspiration Retrieving (SAFER) in Python"
readme = "README.md"
requires-python = ">=3.8"
keywords = ["hydrology", "remote sensing", "evapotranspiration", "safer", "agriculture"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Hydrology",
]

# This is the "Must-Haves" list for Point & Image processing
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "matplotlib", # For the plots in your .ipynb
]